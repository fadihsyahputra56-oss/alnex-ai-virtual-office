# Render — ALNEX AI Virtual Office
# Cara pakai: push repo ini ke GitHub, lalu di Render pilih
# "New +" > "Web Service" > hubungkan repo ini, atau
# "New +" > "Blueprint" dan pilih file render.yaml ini.
# JANGAN menulis secret asli di file ini. Isi semua secret
# lewat Render Dashboard > Service > Environment.

services:
  - type: web
    name: alnex-ai-virtual-office
    env: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: OWNER_PIN
        sync: false
      - key: LYNK_MERCHANT_KEY
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      # Opsional, hanya bila memakai model AI eksternal:
      - key: OPENAI_API_KEY
        sync: false
